name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # all 3 Python versions always run
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4   # ← was @v6 (does not exist)

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5   # ← was @v6 (does not exist)
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"            # ← caches pip downloads between runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src
        env:
          MYPY_CACHE_DIR: .mypy_cache   # persisted by pip cache step

      - name: Pytest with coverage
        run: |
          pytest \
            --cov=mcp_india_stack \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage report
        if: matrix.python-version == '3.12'   # upload once, from latest Python
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
