name: Rules Staleness Audit

on:
  schedule:
    - cron: "0 4 * * 1" # Weekly every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Check Statutory Rules Staleness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Audit statutory rules
        id: check_rules
        run: |
          python scripts/check_rules_staleness.py --json > staleness_report.json || true
          ISSUES_COUNT=$(jq '. | length' staleness_report.json)
          echo "issues_count=$ISSUES_COUNT" >> "$GITHUB_OUTPUT"

      - name: Open Issue if Stale Rules Detected
        if: steps.check_rules.outputs.issues_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Automated Alert: Statutory rule sets require refresh or verification" \
            --body "The weekly statutory rules audit detected stale or expired rule sets in MCP-India-Stack. Please review scripts/check_rules_staleness.py and update src/mcp_india_stack/tools/rules_metadata.py with source-verified statutory rates."
